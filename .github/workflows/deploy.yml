name: BotEnergy Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Hamma ish VPS'ning O'ZIDA bajariladi: build ham, deploy ham (self-hosted runner).
#
#   checkout → deploy.sh → publish → migratsiya → rolling restart + health gate
#            → muvaffaqiyatsiz bo'lsa avtomatik rollback (oldingi release'ga)
#
# Servislar systemd unit'lari sifatida ishlaydi (botenergy-<Servis>.service).
# Sirlar namunasi: deploy/botenergy.env.example
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# DIQQAT: bu workflow'ga HECH QACHON `pull_request` trigger qo'shmang.
# Repo public va runner sizning serveringizda — fork'dan kelgan PR VPS'da
# ixtiyoriy kod ishga tushira olardi.

concurrency:
  group: deploy-production
  cancel-in-progress: false      # deploy yarmida uzilmasin

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Tashqi edge tekshiruvi (PUBLIC_DOMAIN sozlangan bo'lsa)
        if: vars.PUBLIC_DOMAIN != ''
        run: |
          echo "▶ https://${{ vars.PUBLIC_DOMAIN }}/health"
          curl -fsS --max-time 10 "https://${{ vars.PUBLIC_DOMAIN }}/health" > /dev/null
          echo "✅ Tashqi edge javob berdi"
