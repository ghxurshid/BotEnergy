server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker konteyner loglari. Servislar Production'da CompactJsonFormatter bilan
  # stdout'ga yozadi (Observability:ConsoleJsonLogs=true), shuning uchun JSON parse qilamiz.
  - job_name: botenergy-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # Faqat botenergy-* konteynerlari.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/botenergy-.*"
        action: keep

    pipeline_stages:
      - json:
          expressions:
            timestamp: "@t"
            level: "@l"
            message: "@m"
            service: Service
            trace_id: TraceId
            span_id: SpanId
            exception: "@x"
      - labels:
          service:
          level:
      # TraceId label EMAS, faqat maydon — label sifatida u yuqori kardinallikka olib keladi
      # va Loki indeksini shishiradi. Grafana derived field orqali Tempo'ga o'tadi.
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
      - output:
          source: message

  # Nginx access/error loglari (JSON emas — matn).
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/*.log
