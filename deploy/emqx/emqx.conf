## ────────────────────────────────────────────────────────────────────────────
## BotEnergy EMQX 5.x konfiguratsiyasi.
##
## Muhim tamoyil: broker qurilmalar ro'yxatini SAQLAMAYDI. Har CONNECT'da
## DeviceApi'ning authn hook'i chaqiriladi va yagona haqiqat manbai PostgreSQL
## bo'lib qoladi — qurilma o'chirilsa yoki nofaol qilinsa, brokerdan ham tushadi.
##
## ${VAR} qiymatlar konteyner env'idan keladi (/etc/botenergy/botenergy.env).
## ────────────────────────────────────────────────────────────────────────────

node {
  name = "emqx@127.0.0.1"
  cookie = "${EMQX_NODE_COOKIE}"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = botenergy
  discovery_strategy = manual   # bitta node; klasterga o'tishda dns/etcd ga almashtiriladi
}

log {
  console {
    enable = true
    level = warning
  }
  file {
    enable = false   # loglar stdout orqali Promtail/Loki ga ketadi
  }
}

## ── Listener'lar ────────────────────────────────────────────────────────────

## Xom MQTT over TLS — ESP32 qurilmalar shu portga ulanadi.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 50000
  ssl_options {
    certfile = "/etc/emqx/certs/fullchain.pem"
    keyfile  = "/etc/emqx/certs/privkey.pem"
    versions = ["tlsv1.3", "tlsv1.2"]
    ## mTLS bosqichiga o'tishda: verify = verify_peer, fail_if_no_peer_cert = true
    ## va cacertfile = xususiy CA (Let's Encrypt klient sertifikat bermaydi).
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

## MQTT over WebSocket — brauzer klientlari (simulyator, admin panel).
## TLS'ni oldindagi Nginx terminate qiladi, shuning uchun bu yerda plain ws.
## Port tashqariga chiqarilmagan (compose'da `ports:` yo'q).
listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 20000
  websocket {
    mqtt_path = "/mqtt"
    ## Nginx uzatgan haqiqiy klient IP'sini olish — aks holda barcha WS klientlar
    ## Nginx IP'sida ko'rinadi va per-client limitlar ma'nosini yo'qotadi.
    proxy_address_header = "x-forwarded-for"
    proxy_port_header = "x-forwarded-port"
  }
}

## Shifrlanmagan MQTT — PRODUCTION'DA O'CHIQ.
listeners.tcp.default {
  enable = false
}
listeners.wss.default {
  enable = false   # WSS Nginx darajasida hal qilinadi
}

## ── MQTT protokol limitlari ─────────────────────────────────────────────────

mqtt {
  max_packet_size = 64KB
  max_clientid_len = 128
  max_topic_levels = 8
  max_qos_allowed = 1          # QoS 2 kerak emas: idempotentlik envelope id bilan ta'minlanadi
  retain_available = true
  keepalive_multiplier = 1.5
  session_expiry_interval = 2h
  max_inflight = 32
  max_mqueue_len = 1000
}

## Ulanish tezligi cheklovi — DDoS/reconnect bo'ronidan himoya.
listeners.ssl.default.max_conn_rate = 200
listeners.ws.default.max_conn_rate = 200

## ── Autentifikatsiya: DeviceApi HTTP hook ───────────────────────────────────

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://deviceapi:5004/internal/mqtt/authn"
    headers {
      "content-type" = "application/json"
      "x-internal-secret" = "${INTERNAL_API_SHARED_SECRET}"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

## ── Avtorizatsiya (topic ACL): DeviceApi HTTP hook ──────────────────────────

authorization {
  ## Hech bir qoida mos kelmasa — RAD ETILADI. Default `allow` bo'lsa,
  ## hook vaqtincha yiqilganda broker butunlay ochilib qolardi.
  no_match = deny
  deny_action = disconnect

  cache {
    enable = true
    max_size = 32000
    ttl = "5m"
  }

  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://deviceapi:5004/internal/mqtt/authz"
      headers {
        "content-type" = "application/json"
        "x-internal-secret" = "${INTERNAL_API_SHARED_SECRET}"
      }
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      pool_size = 8
      request_timeout = "5s"
    }
  ]
}

## ── Observability ───────────────────────────────────────────────────────────

prometheus {
  enable = true
  ## Prometheus internal tarmoqdan scrape qiladi: http://emqx:18083/api/v5/prometheus/stats
}

dashboard {
  listeners.http {
    bind = 18083   # tashqariga chiqarilmaydi — SSH tunnel orqali
  }
  default_username = "admin"
  default_password = "${EMQX_DASHBOARD_PASSWORD}"
}
