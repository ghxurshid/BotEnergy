groups:
  # ── Infratuzilma ──────────────────────────────────────────────────────────
  - name: botenergy-infrastructure
    rules:
      - alert: ServiceDown
        expr: up{job="botenergy"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} javob bermayapti"
          description: "Prometheus 2 daqiqadan beri {{ $labels.service }} dan metrika ololmayapti."

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL yiqildi"

      - alert: BrokerDown
        expr: up{job="emqx"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "EMQX broker javob bermayapti — qurilmalar ulana olmaydi"

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Redis yiqildi — refresh token va MQTT replay counter'lar fallback rejimida"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk bo'sh joyi 15% dan kam"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > (pg_settings_max_connections * 0.8)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL ulanishlari limitning 80% dan oshdi — PgBouncer kerak bo'lishi mumkin"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis xotirasi 80% dan oshdi"
          description: "maxmemory-policy=noeviction — to'lganda YOZISH TO'XTAYDI (refresh token, replay counter)."

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS sertifikat {{ $value | humanize }} kundan keyin tugaydi"

  # ── API sog'lig'i ─────────────────────────────────────────────────────────
  - name: botenergy-api
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          /
          sum by (service) (rate(http_server_request_duration_seconds_count[5m])) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} da 5xx darajasi 1% dan yuqori"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_server_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 kechikishi 1 soniyadan yuqori"

      - alert: RateLimitRejectionsHigh
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code="429"}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "So'rovlarning 5% dan ortig'i 429 olmoqda"
          description: "Yo limit juda past sozlangan, yo hujum ketmoqda."

  # ── MQTT / qurilmalar ─────────────────────────────────────────────────────
  - name: botenergy-devices
    rules:
      - alert: MqttHmacFailureSpike
        expr: sum(rate(botenergy_mqtt_rejected_total{reason="hmac"}[5m])) * 60 > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "HMAC xatolari daqiqasiga 10 tadan oshdi"
          description: "Hujum urinishi yoki noto'g'ri firmware. Qaysi serial ekanini loglardan qidiring."

      - alert: MqttReplayRejections
        expr: sum(rate(botenergy_mqtt_rejected_total{reason="replay"}[10m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Replay counter bo'yicha rad etishlar bor"
          description: "Ehtimol qurilma EEPROM'i qayta flash qilingan. Tekshirib, kerak bo'lsa DeviceAdmin.ResetMqttCounters."

      - alert: DevicesDropped
        expr: |
          (emqx_connections_count - emqx_connections_count offset 10m)
          / (emqx_connections_count offset 10m) < -0.2
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Ulangan qurilmalar soni 10 daqiqada 20% dan ko'p tushdi"

      - alert: MqttPipelineSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(botenergy_mqtt_pipeline_duration_ms_bucket[5m]))
          ) > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "MQTT pipeline p95 500 ms dan sekin — DB yoki Redis bo'g'ilgan bo'lishi mumkin"
