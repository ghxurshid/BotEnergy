# Alertmanager — Telegram orqali xabar berish.
#
# Sirlar env var'dan: ALERT_TELEGRAM_BOT_TOKEN, ALERT_TELEGRAM_CHAT_ID
# (Alertmanager konfiguratsiyada $VAR kengaytirishni QO'LLAB-QUVVATLAMAYDI —
#  qiymatlarni deploy vaqtida envsubst bilan almashtiring yoki shu faylni
#  serverda /etc/botenergy/ ostida real qiymatlar bilan saqlang, git'da emas.)

global:
  resolve_timeout: 5m

route:
  receiver: telegram-warning
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram-critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: telegram-critical
    telegram_configs:
      - bot_token: "${ALERT_TELEGRAM_BOT_TOKEN}"
        chat_id: 0   # ALERT_TELEGRAM_CHAT_ID qiymati bilan almashtiriladi
        parse_mode: HTML
        message: |
          🔴 <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}

  - name: telegram-warning
    telegram_configs:
      - bot_token: "${ALERT_TELEGRAM_BOT_TOKEN}"
        chat_id: 0
        parse_mode: HTML
        message: |
          🟡 <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  # Servis butunlay yiqilgan bo'lsa, undan kelib chiqadigan latency/error
  # alertlarini takrorlamaslik.
  - source_matchers: [severity = "critical", alertname = "ServiceDown"]
    target_matchers: [severity = "warning"]
    equal: [service]
