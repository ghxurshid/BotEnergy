global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: botenergy
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # .NET servislar — OpenTelemetry Prometheus exporter /metrics da.
  - job_name: botenergy
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: Gateway }
      - targets: ["authapi:5002"]
        labels: { service: AuthApi }
      - targets: ["userapi:5006"]
        labels: { service: UserApi }
      - targets: ["adminapi:5001"]
        labels: { service: AdminApi }
      - targets: ["sessionapi:5007"]
        labels: { service: SessionApi }
      - targets: ["billingapi:5003"]
        labels: { service: BillingApi }
      - targets: ["paymentapi:5005"]
        labels: { service: PaymentApi }
      - targets: ["deviceapi:5004"]
        labels: { service: DeviceApi }

  - job_name: emqx
    metrics_path: /api/v5/prometheus/stats
    static_configs:
      - targets: ["emqx:18083"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # TLS sertifikat muddati + tashqi endpoint mavjudligi.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://company.uz/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
