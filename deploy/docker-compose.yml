# ─────────────────────────────────────────────────────────────────────────────
# BotEnergy — production compose.
#
# Ishga tushirish (serverda /opt/botenergy dan):
#   echo "TAG=<git-sha>" > .env
#   docker compose pull && docker compose up -d --wait
#
# Sirlar bu faylda YO'Q — hammasi /etc/botenergy/botenergy.env dan keladi (chmod 0600).
#
# Tarmoq segmentatsiyasi:
#   be-edge — nginx + emqx (tashqi dunyo bilan gaplashadigan yagona segment)
#   be-app  — gateway + API'lar (internal: true, host'ga chiqmaydi)
#   be-data — postgres/redis/rabbitmq (internal: true)
#
# DIQQAT: hech qaysi API'ga `ports:` berilmagan. `docker -p` ufw qoidalarini aylanib
# o'tadi — port berilsa servis butun internetga ochilib qolardi.
# ─────────────────────────────────────────────────────────────────────────────

name: botenergy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-api-common: &api-common
  restart: unless-stopped
  env_file: /etc/botenergy/botenergy.env
  networks: [be-app, be-data]
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  deploy:
    resources:
      limits:
        memory: 512M

networks:
  be-edge:
  be-app:
    internal: true
  be-data:
    internal: true

volumes:
  pgdata:
  redisdata:
  emqxdata:
  rabbitdata:

services:
  # ── EDGE ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: botenergy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/botenergy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/www/botenergy-admin:/var/www/botenergy-admin:ro
    networks: [be-edge, be-app]
    logging: *default-logging
    depends_on: [gateway]

  emqx:
    image: emqx/emqx:5.8.0
    container_name: botenergy-emqx
    restart: unless-stopped
    env_file: /etc/botenergy/botenergy.env
    ports:
      # Faqat MQTTS. WebSocket (8083) tashqariga chiqmaydi — u Nginx orqali /mqtt da.
      - "8883:8883"
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - /opt/botenergy/emqx/certs:/etc/emqx/certs:ro
      - emqxdata:/opt/emqx/data
    networks: [be-edge, be-app]
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── GATEWAY ───────────────────────────────────────────────────────────────
  gateway:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-gateway:${TAG}
    container_name: botenergy-gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  # ── API'lar ───────────────────────────────────────────────────────────────
  authapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-authapi:${TAG}
    container_name: botenergy-authapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  userapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-userapi:${TAG}
    container_name: botenergy-userapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5006/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  adminapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-adminapi:${TAG}
    container_name: botenergy-adminapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  billingapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-billingapi:${TAG}
    container_name: botenergy-billingapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5003/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  paymentapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-paymentapi:${TAG}
    container_name: botenergy-paymentapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5005/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  deviceapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-deviceapi:${TAG}
    container_name: botenergy-deviceapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5004/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  sessionapi:
    <<: *api-common
    image: ghcr.io/${IMAGE_PREFIX}-sessionapi:${TAG}
    container_name: botenergy-sessionapi
    # MQTT brokeriga ulanadi — emqx be-app tarmog'ida ham bor.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5007/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  # ── DATA ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: botenergy-postgres
    restart: unless-stopped
    env_file: /etc/botenergy/botenergy.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [be-data]
    logging: *default-logging
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=16MB
        -c maintenance_work_mem=512MB
        -c wal_compression=on
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: botenergy-redis
    restart: unless-stopped
    # noeviction — MQTT replay counter'lari va refresh tokenlar shu yerda.
    # allkeys-lru bo'lsa Redis xotira to'lganda replay counter'ni JIMGINA o'chirib,
    # replay himoyasini buzardi. Yozish xatosi jim buzilishdan yaxshiroq.
    command: >
      redis-server
        --appendonly yes
        --maxmemory 1gb
        --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks: [be-data]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: botenergy-rabbitmq
    restart: unless-stopped
    profiles: ["messaging"]   # docker compose --profile messaging up
    env_file: /etc/botenergy/botenergy.env
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-botenergy.conf:ro
    networks: [be-data]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
