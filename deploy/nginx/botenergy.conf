# ─────────────────────────────────────────────────────────────────────────────
# BotEnergy edge — TLS termination, birinchi mudofaa chizig'i, protokol marshrutlash.
#
# 443 dan o'tadigan uch xil trafik:
#   /api/*   → gateway (YARP)
#   /hubs/*  → gateway (SignalR WebSocket)
#   /mqtt    → emqx (MQTT over WebSocket) — YARP'ni chetlab o'tadi
#
# 8883 (xom MQTT over TLS) bu faylda YO'Q — u HTTP emas, shuning uchun path bo'yicha
# marshrutlab bo'lmaydi va EMQX o'z portida TLS'ni o'zi terminate qiladi.
#
# company.uz ni haqiqiy domen bilan almashtiring.
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone  $binary_remote_addr zone=api_zone:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth_zone:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# SignalR tokenni query-string'da yuboradi (brauzer WebSocket'da header qo'ya olmaydi).
# Log'da u ochiq qolmasligi kerak.
map $request_uri $safe_uri {
    ~^(?<clean_path>[^?]*)\?.*access_token=.*$  "$clean_path?access_token=***";
    default                                     $request_uri;
}

log_format botenergy '$remote_addr - $status "$request_method $safe_uri" '
                     'rt=$request_time urt=$upstream_response_time '
                     'reqid=$request_id ua="$http_user_agent"';

upstream botenergy_gateway {
    server gateway:8080;
    keepalive 64;
}

upstream botenergy_mqtt_ws {
    server emqx:8083;
    keepalive 32;
}

# nginx-exporter uchun stub_status — faqat internal docker tarmog'idan.
# 8080 host'ga publish qilinmagan, ya'ni tashqaridan yetib bo'lmaydi.
server {
    listen 8080;
    access_log off;

    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;   # docker bridge diapazoni
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name company.uz www.company.uz mqtt.company.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name company.uz www.company.uz;

    access_log /var/log/nginx/botenergy.log botenergy;

    ssl_certificate     /etc/letsencrypt/live/company.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/company.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    server_tokens off;

    client_max_body_size  10m;
    client_body_timeout   15s;   # slowloris
    client_header_timeout 15s;
    limit_conn conn_zone 50;

    # ── Auth: brute-force'ga qarshi eng qattiq limit ──────────────────────
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://botenergy_gateway;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ── Qolgan REST API ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://botenergy_gateway;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ── SignalR: uzoq yashovchi WebSocket ─────────────────────────────────
    location /hubs/ {
        access_log off;              # token query-string'da
        proxy_pass http://botenergy_gateway;
        include /etc/nginx/snippets/proxy-common.conf;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;     # real-time push buferlanmasin
    }

    # ── MQTT over WebSocket: to'g'ridan-to'g'ri EMQX ga ────────────────────
    # Gateway'dan o'tkazilmaydi: bu ulanishlarga JWT ham, audit ham kerak emas
    # (EMQX o'z authn/authz hook'i bilan himoyalangan), va soatlab ochiq turadigan
    # WS ulanishlari gateway restart'ida uzilib qolmasligi kerak.
    location /mqtt {
        proxy_pass http://botenergy_mqtt_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location = /health {
        proxy_pass http://botenergy_gateway/health/live;
        include /etc/nginx/snippets/proxy-common.conf;
        access_log off;
    }

    # Prometheus /metrics tashqariga CHIQARILMAYDI — u internal tarmoqdan scrape qilinadi.
    location /metrics {
        return 404;
    }

    # ── Admin SPA (statik) ────────────────────────────────────────────────
    location / {
        root /var/www/botenergy-admin;
        try_files $uri $uri/ /index.html;
    }
}
