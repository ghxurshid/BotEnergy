# Barcha proxy_pass location'lari uchun umumiy header'lar.
#
# X-Forwarded-* ni gateway UseForwardedHeaders() o'qiydi va RemoteIpAddress'ni
# haqiqiy klient IP'siga almashtiradi — rate limiting'ning to'g'ri ishlashi shunga bog'liq.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;

proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;

# Gateway yiqilgan/qayta ishga tushayotgan bo'lsa keyingi upstream'ga o'tish
# (bir nechta replika bo'lganda ishlaydi).
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
