## BotEnergy RabbitMQ — faqat internal tarmoqda.

load_definitions = /etc/rabbitmq/definitions.json

## guest hisobi butunlay o'chirilgan — hatto localhost'dan ham.
loopback_users = none

## Xotira va disk chegaralari — RabbitMQ butun mashinani yeb qo'ymasin.
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 2GB

## Management UI faqat internal tarmoqda (SSH tunnel orqali kiriladi).
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672

## Prometheus plugin (docker image'da yoqilgan bo'lsa).
prometheus.tcp.port = 15692

## Consumer 30 daqiqada ack bermasa — xabar qaytariladi.
consumer_timeout = 1800000

log.console = true
log.console.level = warning
log.file = false
